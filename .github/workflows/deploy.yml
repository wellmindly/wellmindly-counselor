name: Deploy to AWS S3 + CloudFront (counselor.wellmindly.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Deploy to S3
        # Hashed assets are immutable and never deleted, so a browser still holding
        # the previous index.html can load its old chunks after a deploy. HTML is
        # no-cache so every load picks up the newest asset names.
        run: |
          aws s3 sync dist/assets s3://${{ secrets.AWS_S3_BUCKET || 'counselor.wellmindly.com' }}/assets --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET || 'counselor.wellmindly.com' }} --delete --exclude "assets/*" --exclude "*.html"
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET || 'counselor.wellmindly.com' }} --exclude "*" --include "*.html" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
